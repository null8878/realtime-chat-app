name: Security
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - run: npm ci 2>/dev/null || npm install
      - name: npm audit
        run: npm audit --audit-level=high 2>/dev/null || true
