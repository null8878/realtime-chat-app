<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; }
    .sidebar { width: 260px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #0f3460; }
    .sidebar-header h2 { color: #e94560; font-size: 18px; }
    .rooms-list { flex: 1; overflow-y: auto; padding: 10px; }
    .room-item { padding: 12px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; transition: background 0.2s; }
    .room-item:hover { background: #0f3460; }
    .room-item.active { background: #e94560; }
    .room-item .name { font-weight: 600; }
    .room-item .last-message { font-size: 12px; color: #888; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .online-users { padding: 10px; border-top: 1px solid #0f3460; }
    .online-users h4 { color: #888; font-size: 12px; margin-bottom: 8px; }
    .online-user { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; }
    .online-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; }
    .chat-area { flex: 1; display: flex; flex-direction: column; }
    .chat-header { padding: 16px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
    .chat-header h3 { color: #e94560; }
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 70%; }
    .message.own { align-self: flex-end; }
    .message .meta { font-size: 11px; color: #888; margin-bottom: 4px; }
    .message .bubble { background: #0f3460; padding: 10px 14px; border-radius: 16px; border-bottom-left-radius: 4px; }
    .message.own .bubble { background: #e94560; border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
    .typing-indicator { padding: 0 20px; height: 24px; font-size: 12px; color: #888; }
    .input-area { padding: 16px 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 12px; }
    .input-area input { flex: 1; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 24px; padding: 12px 16px; color: #eee; font-size: 14px; outline: none; }
    .input-area input:focus { border-color: #e94560; }
    .input-area button { background: #e94560; border: none; border-radius: 50%; width: 44px; height: 44px; cursor: pointer; font-size: 18px; }
    .login-form { max-width: 400px; margin: auto; padding: 40px; background: #16213e; border-radius: 16px; }
    .login-form h2 { color: #e94560; margin-bottom: 24px; text-align: center; }
    .login-form input { width: 100%; padding: 12px; margin-bottom: 12px; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 8px; color: #eee; font-size: 14px; }
    .login-form button { width: 100%; padding: 12px; background: #e94560; border: none; border-radius: 8px; color: #eee; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="auth-screen" class="login-form">
    <h2>Join Chat</h2>
    <input type="text" id="auth-username" placeholder="Username">
    <input type="email" id="auth-email" placeholder="Email">
    <input type="password" id="auth-password" placeholder="Password">
    <button onclick="register()">Register / Login</button>
  </div>

  <div id="chat-screen" style="display:none; width:100%; height:100vh;">
    <div class="sidebar">
      <div class="sidebar-header"><h2>Chat Rooms</h2></div>
      <div class="rooms-list" id="rooms-list"></div>
      <div class="online-users">
        <h4>ONLINE</h4>
        <div id="online-users"></div>
      </div>
    </div>
    <div class="chat-area">
      <div class="chat-header">
        <h3 id="current-room">Select a room</h3>
        <span id="room-members"></span>
      </div>
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typing"></div>
      <div class="input-area">
        <input type="text" id="message-input" placeholder="Type a message..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">&#10148;</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    let socket, token, currentUser, currentRoom;

    async function register() {
      const username = document.getElementById('auth-username').value;
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();

        if (res.ok) {
          token = data.token;
          currentUser = data.user;
          connectSocket();
          loadRooms();
          document.getElementById('auth-screen').style.display = 'none';
          document.getElementById('chat-screen').style.display = 'flex';
        } else {
          // Try login
          const loginRes = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
          const loginData = await loginRes.json();
          if (loginRes.ok) {
            token = loginData.token;
            currentUser = loginData.user;
            connectSocket();
            loadRooms();
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'flex';
          } else {
            alert(data.error || loginData.error);
          }
        }
      } catch (err) {
        alert('Connection failed');
      }
    }

    function connectSocket() {
      socket = io({ auth: { token } });

      socket.on('connect', () => console.log('Connected'));
      socket.on('disconnect', () => console.log('Disconnected'));

      socket.on('message:new', (message) => {
        if (message.roomId === currentRoom) {
          addMessage(message);
        }
      });

      socket.on('user:typing', (data) => {
        if (data.roomId === currentRoom && data.userId !== currentUser.id) {
          document.getElementById('typing').textContent = `${data.username} is typing...`;
          setTimeout(() => {
            document.getElementById('typing').textContent = '';
          }, 3000);
        }
      });

      socket.on('users:online', (users) => {
        const container = document.getElementById('online-users');
        container.innerHTML = users.map(u =>
          `<div class="online-user"><div class="online-dot"></div>${u.username || u}</div>`
        ).join('');
      });

      socket.on('user:online', () => reloadOnlineUsers());
      socket.on('user:offline', () => reloadOnlineUsers());
    }

    async function loadRooms() {
      const res = await fetch('/api/rooms', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const rooms = await res.json();
      const container = document.getElementById('rooms-list');
      container.innerHTML = rooms.map(r =>
        `<div class="room-item" onclick="joinRoom('${r._id}', '${r.name}')">
          <div class="name"># ${r.name}</div>
          <div class="last-message">${r.lastMessage?.content || 'No messages yet'}</div>
        </div>`
      ).join('');
    }

    async function joinRoom(roomId, roomName) {
      if (currentRoom) socket.emit('room:leave', currentRoom);
      currentRoom = roomId;
      document.getElementById('current-room').textContent = `# ${roomName}`;

      socket.emit('room:join', roomId);

      const res = await fetch(`/api/messages/${roomId}`, {
        headers: { Authorization: `Bearer ${token}` }
      });
      const messages = await res.json();

      const container = document.getElementById('messages');
      container.innerHTML = '';
      messages.forEach(m => addMessage(m));
    }

    function addMessage(message) {
      const container = document.getElementById('messages');
      const isOwn = message.userId === currentUser?.id;
      const div = document.createElement('div');
      div.className = `message ${isOwn ? 'own' : ''}`;
      div.innerHTML = `
        <div class="meta">${message.username} • ${new Date(message.createdAt).toLocaleTimeString()}</div>
        <div class="bubble">${message.content}</div>
      `;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content || !currentRoom) return;

      socket.emit('message:send', { roomId: currentRoom, content });
      input.value = '';
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
      else socket.emit('message:typing', { roomId: currentRoom, isTyping: true });
    }

    async function reloadOnlineUsers() {
      const res = await fetch('/api/users/online', {
        headers: { Authorization: `Bearer ${token}` }
      });
      const users = await res.json();
      const container = document.getElementById('online-users');
      container.innerHTML = users.map(u =>
        `<div class="online-user"><div class="online-dot"></div>${u.username}</div>`
      ).join('');
    }
  </script>
</body>
</html>
